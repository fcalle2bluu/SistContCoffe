<div id="lineas-asiento">
  {% if lineas %}
  <div class="table-wrap">
    <table class="ledger">
      <thead><tr><th>Cuenta</th><th>Lado</th><th class="num">Monto</th><th></th></tr></thead>
      <tbody>
        {% for l in lineas %}
        <tr class="line-row">
          <td>{{ l.nombre }}</td>
          <td class="uppercase small">{{ l.lado }}</td>
          <td class="num">{{ l.monto|bs }}</td>
          <td class="text-right">
            <button type="button" class="link-danger"
              hx-post="/dashboard/contabilidad/diario/linea/quitar"
              hx-include="closest form"
              hx-vals='{"quitar_index": "{{ loop.index0 }}"}'
              hx-target="#lineas-asiento" hx-swap="outerHTML">Quitar</button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% endif %}

  {% for l in lineas %}
  <input type="hidden" name="cuenta" value="{{ l.codigo_cuenta }}" />
  <input type="hidden" name="lado" value="{{ l.lado }}" />
  <input type="hidden" name="monto" value="{{ l.monto }}" />
  {% endfor %}

  <div class="cart-total-row">
    <p class="cart-total-label">Debe Bs {{ total_debe|bs }} · Haber Bs {{ total_haber|bs }}{% if lineas and total_debe == total_haber %} · Cuadrado{% endif %}</p>
  </div>
</div>
