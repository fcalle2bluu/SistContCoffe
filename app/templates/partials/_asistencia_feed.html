{% if marcadas|length == 0 %}
<p class="muted">{{ "Todavía nadie registró asistencia hoy." if es_hoy else "No hay marcas el " ~ dia_nombre ~ "." }}</p>
{% else %}
<div class="table-wrap">
  <table class="data-table">
    <thead><tr><th>Nombre</th><th>Tipo</th><th>Hora</th><th></th></tr></thead>
    <tbody>
      {% for m in marcadas %}
      <tr>
        <td class="strong">{{ m.nombre }}</td>
        <td><span class="marca-tipo marca-{{ m.tipo }}">{{ 'Entrada' if m.tipo == 'entrada' else 'Salida' }}</span></td>
        <td class="mono">{{ m.marcado_en|hora }}</td>
        <td class="text-right">
          <form method="post" action="/dashboard/asistencia/{{ m.id }}/eliminar"
            onsubmit="return confirm('¿Eliminar la {{ m.tipo }} de {{ m.nombre }} del {{ dia_nombre }} a las {{ m.marcado_en|hora }}? Esta acción no se puede deshacer.');"
            style="display:inline;">
            <input type="hidden" name="volver" value="{{ dia }}" />
            <button type="submit" class="link-danger">Eliminar</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endif %}
