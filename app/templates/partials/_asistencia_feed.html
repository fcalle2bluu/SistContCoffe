{% if marcadas|length == 0 %}
<p class="muted">Todavía nadie registró asistencia hoy.</p>
{% else %}
<div class="table-wrap">
  <table class="data-table">
    <thead><tr><th>Nombre</th><th>Tipo</th><th>Hora</th></tr></thead>
    <tbody>
      {% for m in marcadas %}
      <tr>
        <td class="strong">{{ m.nombre }}</td>
        <td>{{ 'Entrada' if m.tipo == 'entrada' else 'Salida' }}</td>
        <td class="mono">{{ m.marcado_en|hora }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endif %}
