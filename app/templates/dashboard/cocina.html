{% extends "dashboard/_shell.html" %}
{% block title %}Cocina — Café Yanaloma{% endblock %}
{% block content %}
<div class="stack-8">
  <div class="cocina-header">
    <div>
      <h2 class="section-title">Cocina</h2>
      <p class="section-subtitle">Pedidos en vivo — pagados y cuentas pendientes. Suena solo con comida y pastelería (en negrita).</p>
    </div>
    <button type="button" id="btn-activar-sonido" class="btn btn-primary">🔔 Activar sonido</button>
  </div>

  <div id="cocina-feed" hx-get="/dashboard/cocina/feed" hx-trigger="every 4s, refrescar" hx-swap="innerHTML">
    {% include "partials/_cocina_feed.html" %}
  </div>
</div>

<script>
(function () {
  var audioCtx = null;
  var sonidoActivo = false;
  var vistos = null; // null = todavía no inicializado con la primera carga

  // Cantidad de productos de cocina (comida/pastelería) de cada pedido: suena
  // si aparece un pedido con algo de cocina o si a uno le agregan más.
  function estadoActual() {
    var estado = {};
    document.querySelectorAll("#cocina-feed [data-orden-id]").forEach(function (el) {
      estado[el.getAttribute("data-orden-id")] = parseFloat(el.getAttribute("data-cocina")) || 0;
    });
    return estado;
  }

  function llamadosActuales() {
    var ids = [];
    document.querySelectorAll("#cocina-feed [data-llamado-id]").forEach(function (el) {
      ids.push(el.getAttribute("data-llamado-id"));
    });
    return ids;
  }

  function pitido() {
    if (!sonidoActivo || !audioCtx) return;
    // En el celular el AudioContext se suspende solo tras un rato sin uso
    // (aunque el botón ya lo haya activado); si no se reanuda acá, el
    // pedido nuevo llega y no suena nada.
    if (audioCtx.state === "suspended") audioCtx.resume();
    // Timbre fuerte y agudo (cuadrada, no seno) para que se escuche por
    // encima del ruido de cocina: 6 pitidos cortos y volumen al máximo.
    [0, 300, 600, 900, 1200, 1500].forEach(function (delay) {
      setTimeout(function () {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = 1200;
        gain.gain.value = 1;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }, delay);
    });
  }

  function vibrar() {
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]); } catch (e) {}
  }

  document.getElementById("btn-activar-sonido").addEventListener("click", function () {
    if (!audioCtx) {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    sonidoActivo = true;
    this.textContent = "🔔 Sonido activado";
    this.classList.add("btn-outline");
    pitido();
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  });

  // La primera carga (la que ya viene renderizada en la página) no debe sonar
  // — solo alertamos cuando aparece un pedido nuevo en una actualización.
  vistos = estadoActual();

  document.body.addEventListener("htmx:afterSwap", function (evt) {
    if (evt.target.id !== "cocina-feed") return;
    var actuales = estadoActual();
    var hayNuevo = Object.keys(actuales).some(function (id) {
      return actuales[id] > (vistos[id] || 0);
    });
    vistos = actuales;
    // Un llamado de la caja suena en cada actualización (cada 4 s) hasta que
    // alguien aprieta "Ya voy".
    var llamados = llamadosActuales();
    if (hayNuevo || llamados.length) { pitido(); vibrar(); }
  });
})();
</script>
{% endblock %}
