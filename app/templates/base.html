<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Café Yanaloma{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v={{ style_version }}" />
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body hx-boost="true">
  {% if request.app.state.actualizacion_disponible %}
  <div class="update-banner">
    <span>Hay una actualización nueva. Cuando puedas, cierra este programa y ábrelo de nuevo para aplicarla.</span>
    <button type="button" onclick="this.closest('.update-banner').remove()" aria-label="Cerrar aviso">×</button>
  </div>
  {% endif %}
  {% block body %}{% endblock %}
</body>
</html>
