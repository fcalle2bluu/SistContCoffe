<div id="carrito">
  {% if cart %}
  <div class="cart-table-wrap">
    <table class="cart-table">
      <tbody>
        {% for it in cart %}
        <tr>
          <td>{{ it.producto_nombre }}</td>
          <td class="text-right mono small">{{ it.cantidad }} × {{ "%.2f"|format(it.precio_unitario) }}</td>
          <td class="text-right mono strong">{{ "%.2f"|format(it.cantidad * it.precio_unitario) }}</td>
          <td class="text-right">
            <button type="button" class="link-danger"
              hx-post="/dashboard/ventas/carrito/quitar"
              hx-include="closest form"
              hx-vals='{"quitar_id": "{{ it.producto_id }}"}'
              hx-target="#carrito" hx-swap="outerHTML">Quitar</button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% endif %}

  {% for it in cart %}
  <input type="hidden" name="cart_producto_id" value="{{ it.producto_id }}" />
  <input type="hidden" name="cart_nombre" value="{{ it.producto_nombre }}" />
  <input type="hidden" name="cart_cantidad" value="{{ it.cantidad }}" />
  <input type="hidden" name="cart_precio" value="{{ it.precio_unitario }}" />
  {% endfor %}

  <div class="cart-total-row">
    <p class="cart-total-label">Total</p>
    <p class="cart-total-value">Bs {{ "%.2f"|format(total) }}</p>
  </div>
</div>
