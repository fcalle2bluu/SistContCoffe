server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fly.io termina TLS en su borde y reenvía por HTTP al puerto 8080 interno.
    # Sin esto, las redirecciones automáticas (p.ej. /pos -> /pos/) arman la URL
    # con el esquema/puerto internos (http://host:8080/...), que el navegador
    # no puede alcanzar desde afuera. absolute_redirect off hace que nginx
    # redirija solo con la ruta relativa, dejando que el navegador conserve
    # el esquema/host/puerto público.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
    }
}
