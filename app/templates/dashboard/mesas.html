{% extends "dashboard/_shell.html" %}
{% block title %}Mesas — Café Yanaloma{% endblock %}
{% block content %}
<div class="stack-8">
  <div>
    <h2 class="section-title">Mesas</h2>
    <p class="section-subtitle">Disponibilidad en vivo — solo para consultar, acá no se puede vender.</p>
  </div>

  {% include "partials/_mesa_grid_solo_lectura.html" %}
</div>

<script>
(function () {
  // Cuánto lleva pendiente cada mesa ocupada. Se recalcula solo en el
  // cliente (sin pedir nada al servidor) y sobrevive a los swaps de htmx
  // porque busca los tiles en el DOM en cada tick en vez de guardarlos.
  function actualizarTemporizadoresMesas() {
    document.querySelectorAll(".mesa-tile-timer[data-desde]").forEach(function (span) {
      var desde = new Date(span.getAttribute("data-desde")).getTime();
      var ms = Math.max(0, Date.now() - desde);
      var totalSeg = Math.floor(ms / 1000);
      var horas = Math.floor(totalSeg / 3600);
      var minutos = Math.floor((totalSeg % 3600) / 60);
      var segundos = totalSeg % 60;
      if (horas > 0) span.textContent = horas + "h " + minutos + "m " + segundos + "s";
      else if (minutos > 0) span.textContent = minutos + "m " + segundos + "s";
      else span.textContent = segundos + "s";
    });
  }
  actualizarTemporizadoresMesas();
  setInterval(actualizarTemporizadoresMesas, 1000);
})();

(function () {
  // Historial de ventas de hoy por mesa: se abre en un modal armado en JS
  // (no en el HTML que htmx reemplaza cada 5s), así el listener de clic
  // delegado en el body sigue funcionando después de cada refresco.
  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function cerrarModal() {
    var m = document.getElementById("mesa-historial-modal");
    if (m) m.remove();
  }

  function abrirModal(nombre, historial) {
    cerrarModal();
    var filasHtml = historial.length
      ? historial.map(function (h) {
          var estado = h.pendiente
            ? '<span class="badge-warning">Pendiente</span>'
            : '<span class="badge-success">Cobrada</span>';
          return (
            '<div class="mesa-historial-fila">' +
            '<span>' + esc(h.hora) + '</span>' +
            '<span>Bs ' + Number(h.total).toFixed(2) + '</span>' +
            '<span>' + estado + '</span>' +
            '</div>'
          );
        }).join("")
      : '<p class="muted-sm">Todavía no hay ventas hoy en esta mesa.</p>';

    var overlay = document.createElement("div");
    overlay.id = "mesa-historial-modal";
    overlay.className = "mesa-historial-overlay";
    overlay.innerHTML =
      '<div class="mesa-historial-box">' +
      '<div class="mesa-historial-head">' +
      '<h3>Ventas de hoy — Mesa ' + esc(nombre) + '</h3>' +
      '<button type="button" class="mesa-historial-cerrar" aria-label="Cerrar">&times;</button>' +
      '</div>' +
      '<div class="mesa-historial-lista">' + filasHtml + '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay || e.target.classList.contains("mesa-historial-cerrar")) cerrarModal();
    });
  }

  document.body.addEventListener("click", function (e) {
    var tile = e.target.closest(".mesa-tile[data-mesa-nombre]");
    if (!tile) return;
    var historial = [];
    try { historial = JSON.parse(tile.getAttribute("data-historial") || "[]"); } catch (err) {}
    abrirModal(tile.getAttribute("data-mesa-nombre"), historial);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") cerrarModal(); });
})();
</script>
{% endblock %}
